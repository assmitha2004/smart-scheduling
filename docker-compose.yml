# Full stack: docker compose up --build   ->  http://localhost:8080
# Seed demo data: docker compose exec backend npx --yes tsx@4 prisma/seed.ts   (or run the seed locally against the exposed DB)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: smart_scheduling
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    environment:
      # "rules" (default, nothing leaves the server) or "anthropic" (also needs
      # ANTHROPIC_API_KEY and per-user consent in Settings).
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    ports: ["8000:8000"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smart_scheduling
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: http://localhost:8080
      AI_SERVICE_URL: http://ai-service:8000
      PORT: "4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ai-service: { condition: service_started }
    ports: ["4000:4000"]

  worker:
    build: ./backend
    command: ["node", "dist/workers/index.js"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smart_scheduling
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      backend: { condition: service_started }

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
